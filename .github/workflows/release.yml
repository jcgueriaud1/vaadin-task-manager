name: Release

# Pushing a tag such as taskpulse-1.0.0 publishes that version of the add-on
# (and its parent pom) to Maven Central. The demo is not published.
on:
  push:
    tags: ['taskpulse-*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_U
          server-password: CENTRAL_T
      - name: Set the version from the tag
        run: >-
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.23.0:set
          -DnewVersion="${GITHUB_REF_NAME#taskpulse-}" -DgenerateBackupPoms=false
      - name: Deploy to Maven Central
        run: ./mvnw -B -Prelease -pl addon -am deploy
        env:
          CENTRAL_U: ${{ secrets.CENTRAL_USER }}
          CENTRAL_T: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
