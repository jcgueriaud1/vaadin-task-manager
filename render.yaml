# Render Blueprint: a free web service built from the Dockerfile, redeployed
# when main changes and the Test workflow passes. Free instances sleep after
# 15 minutes without traffic, which ends every session and its Task list.
services:
  - type: web
    name: vaadin-task-manager
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /
